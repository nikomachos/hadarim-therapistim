<script>const QUOTES=[{"author": "זיגמונד פרויד", "source": "תרבות בלא נחת", "url": "https://www.gutenberg.org/files/78221/78221-h/78221-h.htm", "text": "החיים, כפי שאנו מוצאים אותם, קשים מדי עבורנו."}, {"author": "זיגמונד פרויד", "source": "תרבות בלא נחת", "url": "https://www.gutenberg.org/files/78221/78221-h/78221-h.htm", "text": "יופי אינו מביא תועלת ברורה, ואף על פי כן התרבות אינה יכולה להתקיים בלעדיו."}, {"author": "זיגמונד פרויד", "source": "תרבות בלא נחת", "url": "https://www.gutenberg.org/files/78221/78221-h/78221-h.htm", "text": "אנו לעולם איננו חסרי הגנה מפני סבל כפי שאנו כאשר אנו אוהבים."}, {"author": "זיגמונד פרויד", "source": "תרבות בלא נחת", "url": "https://www.gutenberg.org/files/78221/78221-h/78221-h.htm", "text": "בני אדם נוטים למדוד את חייהם לפי אמות מידה שגויות."}, {"author": "זיגמונד פרויד", "source": "תרבות בלא נחת", "url": "https://www.gutenberg.org/files/78221/78221-h/78221-h.htm", "text": "האהבה ממשיכה לפעול בתרבות ולחבר בין בני אדם."}, {"author": "קרל גוסטב יונג", "source": "האדם המודרני בחיפוש אחר נפש / כתבים נבחרים", "url": "https://graciousquotes.com/quotes-with-sources/carl-jung/", "text": "איננו יכולים לשנות דבר כל עוד איננו מקבלים אותו."}, {"author": "קרל גוסטב יונג", "source": "האדם המודרני בחיפוש אחר נפש / כתבים נבחרים", "url": "https://graciousquotes.com/quotes-with-sources/carl-jung/", "text": "לשאול את השאלה הנכונה — פירושו כבר לפתור חצי מן הבעיה."}, {"author": "קרל גוסטב יונג", "source": "האדם המודרני בחיפוש אחר נפש / כתבים נבחרים", "url": "https://graciousquotes.com/quotes-with-sources/carl-jung/", "text": "היכרות עם החשכה שבתוכך היא הדרך הטובה ביותר להתמודד עם החשכה של אחרים."}, {"author": "קרל גוסטב יונג", "source": "האדם המודרני בחיפוש אחר נפש / כתבים נבחרים", "url": "https://graciousquotes.com/quotes-with-sources/carl-jung/", "text": "הידע נשען לא רק על אמת, אלא גם על טעות."}, {"author": "קרל גוסטב יונג", "source": "האדם המודרני בחיפוש אחר נפש / כתבים נבחרים", "url": "https://graciousquotes.com/quotes-with-sources/carl-jung/", "text": "אין אדם נעשה מואר מדימוי של אור, אלא מהפיכת החושך למודע."}, {"author": "וילפרד ביון", "source": "הסמינרים בטוויסטוק / מחשבות שניות", "url": "https://www.goodreads.com/author/quotes/496185.Wilfred_R_Bion", "text": "בחדר הטיפולים ראוי שיהיו שני אנשים מעט מפוחדים: המטופל והאנליטיקאי."}, {"author": "וילפרד ביון", "source": "הסמינרים בטוויסטוק / מחשבות שניות", "url": "https://www.goodreads.com/author/quotes/496185.Wilfred_R_Bion", "text": "כאשר אנו מתקרבים אל הלא־מודע — אל מה שאיננו יודעים — צפויה לנו אי־נוחות."}, {"author": "וילפרד ביון", "source": "הסמינרים בטוויסטוק / מחשבות שניות", "url": "https://www.goodreads.com/author/quotes/496185.Wilfred_R_Bion", "text": "אם איש משניהם אינו מפחד, אפשר לתהות למה הם טורחים לגלות את מה שכולם כבר יודעים."}, {"author": "וילפרד ביון", "source": "הסמינרים בטוויסטוק / מחשבות שניות", "url": "https://www.goodreads.com/author/quotes/496185.Wilfred_R_Bion", "text": "הזיכרון נולד מתוך ההתנסות החושית, ורק לה הוא מותאם."}, {"author": "וילפרד ביון", "source": "הסמינרים בטוויסטוק / מחשבות שניות", "url": "https://www.goodreads.com/author/quotes/496185.Wilfred_R_Bion", "text": "חוכמה או שכחה — הבחירה בידיכם."}, {"author": "דונלד ויניקוט", "source": "משחק ומציאות / תקשורת ואי־תקשורת", "url": "https://www.goodreads.com/author/quotes/152502.D_W_Winnicott", "text": "רק במשחק יכול הילד או המבוגר להיות יצירתי ולהשתמש באישיותו כולה."}, {"author": "דונלד ויניקוט", "source": "משחק ומציאות / תקשורת ואי־תקשורת", "url": "https://www.goodreads.com/author/quotes/152502.D_W_Winnicott", "text": "רק בהיותו יצירתי מגלה האדם את העצמי."}, {"author": "דונלד ויניקוט", "source": "משחק ומציאות / תקשורת ואי־תקשורת", "url": "https://www.goodreads.com/author/quotes/152502.D_W_Winnicott", "text": "תענוג להתחבא, אך אסון הוא שלא ימצאו אותך."}, {"author": "דונלד ויניקוט", "source": "משחק ומציאות / תקשורת ואי־תקשורת", "url": "https://www.goodreads.com/author/quotes/152502.D_W_Winnicott", "text": "אמנים נעים בין הרצון לתקשר לבין הרצון להסתתר."}, {"author": "דונלד ויניקוט", "source": "משחק ומציאות / תקשורת ואי־תקשורת", "url": "https://www.goodreads.com/author/quotes/152502.D_W_Winnicott", "text": "אי אפשר להיות מקוריים אלא על בסיס של מסורת."}, {"author": "אהרן בק", "source": "אהבה אינה מספיקה / תרפיה קוגניטיבית", "url": "https://www.goodreads.com/author/quotes/91432.Aaron_T_Beck", "text": "עצור, ותן לעצמך הזדמנות."}, {"author": "אהרן בק", "source": "אהבה אינה מספיקה / תרפיה קוגניטיבית", "url": "https://www.goodreads.com/author/quotes/91432.Aaron_T_Beck", "text": "שאף לבסיס יציב של אמון, נאמנות, כבוד וביטחון."}, {"author": "אהרן בק", "source": "אהבה אינה מספיקה / תרפיה קוגניטיבית", "url": "https://www.goodreads.com/author/quotes/91432.Aaron_T_Beck", "text": "בן או בת הזוג שלך זכאים לראות בך שותף נאמן ותומך."}, {"author": "אהרן בק", "source": "אהבה אינה מספיקה / תרפיה קוגניטיבית", "url": "https://www.goodreads.com/author/quotes/91432.Aaron_T_Beck", "text": "הגישה הקוגניטיבית מסייעת לאנשים לראות את בעיותיהם בפרספקטיבה רחבה יותר."}, {"author": "אהרן בק", "source": "אהבה אינה מספיקה / תרפיה קוגניטיבית", "url": "https://www.goodreads.com/author/quotes/91432.Aaron_T_Beck", "text": "ביחסים קרובים, ביקורת קטנונית עלולה לתפוס את מקומם של גילויי החיבה."}, {"author": "סטיבן מיטשל", "source": "תקווה ואימה בפסיכואנליזה / האם אהבה יכולה להימשך?", "url": "https://www.goodreads.com/work/quotes/165091-hope-and-dread-in-psychoanalysis", "text": "ללא זיכרון אין עצמי."}, {"author": "סטיבן מיטשל", "source": "תקווה ואימה בפסיכואנליזה / האם אהבה יכולה להימשך?", "url": "https://www.goodreads.com/work/quotes/165091-hope-and-dread-in-psychoanalysis", "text": "משמעות היא חוויה אישית המאורגנת כסיפורים."}, {"author": "סטיבן מיטשל", "source": "תקווה ואימה בפסיכואנליזה / האם אהבה יכולה להימשך?", "url": "https://www.goodreads.com/work/quotes/165091-hope-and-dread-in-psychoanalysis", "text": "התפתחות הסובייקטיביות קשורה ללא הפרד בהכרה בסובייקטיביות של אחרים."}, {"author": "סטיבן מיטשל", "source": "תקווה ואימה בפסיכואנליזה / האם אהבה יכולה להימשך?", "url": "https://www.goodreads.com/work/quotes/165091-hope-and-dread-in-psychoanalysis", "text": "הידע הוא הקשרי ולא מוחלט; מתפתח ולא קפוא ונצחי."}, {"author": "סטיבן מיטשל", "source": "תקווה ואימה בפסיכואנליזה / האם אהבה יכולה להימשך?", "url": "https://www.goodreads.com/work/quotes/165091-hope-and-dread-in-psychoanalysis", "text": "חקירה ובנייה של סיפור חיים יחד עם אדם אחר הן התנסות בעלת כוח לשנות."}, {"author": "סטיבן הייז", "source": "לצאת מהראש ולהיכנס לחיים / נפש משוחררת", "url": "https://www.goodreads.com/author/quotes/14253.Steven_C_Hayes", "text": "עלינו ללמוד להתבונן במחשבה, ולא רק להתבונן בעולם מתוכה."}, {"author": "סטיבן הייז", "source": "לצאת מהראש ולהיכנס לחיים / נפש משוחררת", "url": "https://www.goodreads.com/author/quotes/14253.Steven_C_Hayes", "text": "מחשבות הן כמו עדשות שדרכן אנו מביטים בעולם."}, {"author": "סטיבן הייז", "source": "לצאת מהראש ולהיכנס לחיים / נפש משוחררת", "url": "https://www.goodreads.com/author/quotes/14253.Steven_C_Hayes", "text": "ערכים הם כמו כיוונים במצפן: אין מגיעים אליהם סופית."}, {"author": "סטיבן הייז", "source": "לצאת מהראש ולהיכנס לחיים / נפש משוחררת", "url": "https://www.goodreads.com/author/quotes/14253.Steven_C_Hayes", "text": "גמישות פסיכולוגית מאפשרת לחשוב ולהרגיש בפתיחות ולנוע לעבר מה שחשוב לנו."}, {"author": "סטיבן הייז", "source": "לצאת מהראש ולהיכנס לחיים / נפש משוחררת", "url": "https://www.goodreads.com/author/quotes/14253.Steven_C_Hayes", "text": "המטרה אינה לתקן בני אדם, אלא להעצים אותם."}, {"author": "מרשה לינהאן", "source": "מדריך לאימון מיומנויות DBT / לבנות חיים שראוי לחיותם", "url": "https://www.goodreads.com/author/quotes/202733.Marsha_M_Linehan", "text": "קשה להיות מאושרים בלי חיים שאנו חווים כראויים לחיותם."}, {"author": "מרשה לינהאן", "source": "מדריך לאימון מיומנויות DBT / לבנות חיים שראוי לחיותם", "url": "https://www.goodreads.com/author/quotes/202733.Marsha_M_Linehan", "text": "אין זמן טוב או רע לתרגול קשיבות — פשוט מתרגלים."}, {"author": "מרשה לינהאן", "source": "מדריך לאימון מיומנויות DBT / לבנות חיים שראוי לחיותם", "url": "https://www.goodreads.com/author/quotes/202733.Marsha_M_Linehan", "text": "אם מתרגלים להיות מודעים ולפתוח את עצמנו למה שיש, החיים יכולים להשתנות."}, {"author": "מרשה לינהאן", "source": "מדריך לאימון מיומנויות DBT / לבנות חיים שראוי לחיותם", "url": "https://www.goodreads.com/author/quotes/202733.Marsha_M_Linehan", "text": "כל החיים ראויים לחיים; חשוב שגם נחווה את חיינו כבעלי ערך."}, {"author": "מרשה לינהאן", "source": "מדריך לאימון מיומנויות DBT / לבנות חיים שראוי לחיותם", "url": "https://www.goodreads.com/author/quotes/202733.Marsha_M_Linehan", "text": "לפעמים הדרך לצאת מן הגיהינום עוברת בתקופה קשה, אך קשה פחות מן הגיהינום עצמו."}, {"author": "ג׳פרי יאנג", "source": "לשנות את חייך (עם ג׳נט קלוסקו)", "url": "https://www.goodreads.com/work/quotes/43257-reinventing-your-life", "text": "סוד שאנו מסתירים עלול לבודד אותנו."}, {"author": "ג׳פרי יאנג", "source": "לשנות את חייך (עם ג׳נט קלוסקו)", "url": "https://www.goodreads.com/work/quotes/43257-reinventing-your-life", "text": "למדו לבטא את הכעס באופן הולם ובונה."}, {"author": "ג׳פרי יאנג", "source": "לשנות את חייך (עם ג׳נט קלוסקו)", "url": "https://www.goodreads.com/work/quotes/43257-reinventing-your-life", "text": "נסו לכבד את הסיבות שבגללן נוצר דפוס החיים הישן."}, {"author": "ג׳פרי יאנג", "source": "לשנות את חייך (עם ג׳נט קלוסקו)", "url": "https://www.goodreads.com/work/quotes/43257-reinventing-your-life", "text": "מה שעזר לכם פעם לשרוד עלול לפגוע בכם היום."}, {"author": "ג׳פרי יאנג", "source": "לשנות את חייך (עם ג׳נט קלוסקו)", "url": "https://www.goodreads.com/work/quotes/43257-reinventing-your-life", "text": "לא משנה עד כמה ננסה להיות מושלמים — בשלב כלשהו ניכשל במשהו."}, {"author": "בסל ואן דר קולק", "source": "נרשם בגוף: המוח, הנפש והגוף בריפוי מטראומה", "url": "https://www.goodreads.com/author/quotes/21280926.Bessel_van_der_Kolk", "text": "טראומה אינה רק אירוע שקרה בעבר; היא גם החותם שהחוויה הותירה בנפש, במוח ובגוף."}, {"author": "בסל ואן דר קולק", "source": "נרשם בגוף: המוח, הנפש והגוף בריפוי מטראומה", "url": "https://www.goodreads.com/author/quotes/21280926.Bessel_van_der_Kolk", "text": "שתי שאלות חשובות בטיפול הן: ״שים לב לזה״ ו״מה קורה אחר כך?״"}, {"author": "בסל ואן דר קולק", "source": "נרשם בגוף: המוח, הנפש והגוף בריפוי מטראומה", "url": "https://www.goodreads.com/author/quotes/21280926.Bessel_van_der_Kolk", "text": "דרושים אמון ואומץ עצומים כדי להרשות לעצמנו להיזכר."}, {"author": "בסל ואן דר קולק", "source": "נרשם בגוף: המוח, הנפש והגוף בריפוי מטראומה", "url": "https://www.goodreads.com/author/quotes/21280926.Bessel_van_der_Kolk", "text": "היכולת שלנו לפגוע זה בזה שקולה גם ליכולת שלנו לרפא זה את זה."}, {"author": "בסל ואן דר קולק", "source": "נרשם בגוף: המוח, הנפש והגוף בריפוי מטראומה", "url": "https://www.goodreads.com/author/quotes/21280926.Bessel_van_der_Kolk", "text": "שיקום קשרים וקהילה הוא מרכיב מרכזי בשיקום הרווחה הנפשית."}, {"author": "אירווין יאלום", "source": "פסיכותרפיה אקזיסטנציאלית", "url": "https://www.goodreads.com/work/quotes/713498-existential-psychotherapy", "text": "לאהוב פירושו לדאוג באופן פעיל לחייו ולצמיחתו של האחר."}, {"author": "אירווין יאלום", "source": "פסיכותרפיה אקזיסטנציאלית", "url": "https://www.goodreads.com/work/quotes/713498-existential-psychotherapy", "text": "אהבה בשלה היא לאהוב, ולא להיות נאהב."}, {"author": "אירווין יאלום", "source": "מתנת התרפיה", "url": "https://www.goodreads.com/work/quotes/22212-the-gift-of-therapy", "text": "הביטו מבעד לחלונו של האחר. נסו לראות את העולם כפי שהמטופל שלכם רואה אותו."}, {"author": "אירווין יאלום", "source": "מתנת התרפיה", "url": "https://www.goodreads.com/work/quotes/22212-the-gift-of-therapy", "text": "אם טעיתם, הודו בטעות."}, {"author": "אירווין יאלום", "source": "תליין האהבה", "url": "https://www.goodreads.com/work/quotes/162246-love-s-executioner-other-tales-of-psychotherapy", "text": "אחד הפרדוקסים הגדולים של החיים הוא שמודעות עצמית מולידה חרדה."}, {"author": "אירווין יאלום", "source": "תליין האהבה", "url": "https://www.goodreads.com/work/quotes/162246-love-s-executioner-other-tales-of-psychotherapy", "text": "היכולת לשאת אי־ודאות היא תנאי מוקדם לעיסוק במקצוע."}, {"author": "אירווין יאלום", "source": "כשניטשה בכה", "url": "https://www.goodreads.com/author/quotes/909675.Irvin_D_Yalom", "text": "כל אדם חייב לבחור כמה אמת הוא מסוגל לשאת."}, {"author": "אירווין יאלום", "source": "כשניטשה בכה", "url": "https://www.goodreads.com/author/quotes/909675.Irvin_D_Yalom", "text": "רוחו של אדם נבנית מבחירותיו."}, {"author": "אירווין יאלום", "source": "כשניטשה בכה", "url": "https://www.goodreads.com/author/quotes/909675.Irvin_D_Yalom", "text": "אני חולם על אהבה שהיא יותר משני אנשים המשתוקקים להיות בעלים זה של זה."}, {"author": "אירווין יאלום", "source": "להביט בשמש", "url": "https://www.goodreads.com/author/quotes/909675.Irvin_D_Yalom", "text": "במוקדם או במאוחר היא נאלצה לוותר על התקווה לעבר טוב יותר."}, {"author": "היינץ קוהוט", "source": "How Does Analysis Cure? (1984), עמ׳ 82", "url": "https://www.azquotes.com/author/42058-Heinz_Kohut", "text": "אמפתיה היא היכולת לחשוב ולהרגיש את עצמנו אל תוך עולמו הפנימי של אדם אחר."}, {"author": "היינץ קוהוט", "source": "How Does Analysis Cure? (1984), עמ׳ 93–94", "url": "https://relationalselfpsychology.com/Quoting_Kohut.html", "text": "אם יש לקח אחד שלמדתי בחיי כאנליטיקאי, הוא שמה שמטופליי מספרים לי עשוי להיות נכון."}, {"author": "היינץ קוהוט", "source": "The Restoration of the Self (1977), עמ׳ 144", "url": "https://www.azquotes.com/author/42058-Heinz_Kohut", "text": "ההבנה האמפתית של חוויותיהם של אחרים היא יכולת אנושית בסיסית, כמו ראייה ושמיעה."}, {"author": "היינץ קוהוט", "source": "Forms and Transformations of Narcissism (1966), עמ׳ 4", "url": "https://en.wikiquote.org/wiki/Heinz_Kohut", "text": "הניגוד לנרקיסיזם איננו קשר עם אובייקט, אלא אהבת אובייקט."}, {"author": "היינץ קוהוט", "source": "The Search for the Self, כרך ב׳, עמ׳ 682", "url": "https://wordandworld.luthersem.edu/wp-content/uploads/pdfs/21-1_Therapy_Theology/Heinz%20Kohut%20and%20Empathy%3B%20A%20Perspective%20from%20a%20Theology%20of%20the%20Cross.pdf", "text": "האמפתיה האנושית, כאשר אנו משקפים ומאשרים זה את זה, תומכת בעולם של משמעות אנושית."}];const PRAISES=["איזו תשומת לב יפה לפרטים! בזכותך המרחב מחכה בנעימות למי שייכנס אחריך.", "עשית מקום לאחרים — וזה מעשה קטן עם משמעות גדולה.", "תודה על האכפתיות! החדרים נשארו מזמינים, נקיים ונעימים.", "איזה יופי של דאגה למרחב המשותף. רואים שהיה לך חשוב.", "השקעת כמה רגעים והענקת לאחרים התחלה טובה יותר. תודה!", "יש כאן נדיבות שקטה: לחשוב גם על מי שיבוא אחרינו.", "איזה יופי! הקשבה לסביבה היא גם דרך לדאוג לאנשים.", "חמש פעולות קטנות, הרבה התחשבות. ממש משמח!", "תודה שעזרת לבית המטפלים והסדנאות להישאר מקום נעים ובטוח.", "משימת הדאגה למרחב הושלמה! נעים לדעת שיש על מי לסמוך.", "השארת אחריך מרחב שאומר למבקרים הבאים: ״ברוכים הבאים״.", "טיפחת את המרחב שלנו בלי לעשות מזה עניין — וזה נהדר."];const tasks=[...document.querySelectorAll('.task')];let activeQuote=-1;let lastPraise=-1;let previousFull=false;function randomExcept(max,last){if(max<=1)return 0;let n=Math.floor(Math.random()*(last>=0?max-1:max));return last>=0&&n>=last?n+1:n}function update(){let count=tasks.filter(t=>t.classList.contains('done')).length;document.querySelector('#bar').style.width=count*20+'%';document.querySelector('.progress').setAttribute('aria-valuenow',count);document.querySelector('#counter').textContent=`${count} מתוך 5 הושלמו`;if(count===5&&!previousFull)celebrate();previousFull=count===5}tasks.forEach(t=>t.addEventListener('click',()=>{let done=t.classList.toggle('done');t.setAttribute('aria-pressed',String(done));t.querySelector('.check').textContent=done?'✓':'';update()}));function newQuote(){activeQuote=randomExcept(QUOTES.length,activeQuote);let q=QUOTES[activeQuote];document.querySelector('#quote').textContent='״'+q.text.trim().replace(/[.\s]+$/u,'')+'״.';document.querySelector('#author').textContent=q.author;let s=document.querySelector('#source');s.textContent='מקור: '+q.source+' · ';let a=document.createElement('a');a.href=q.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='לעיון במקור';s.append(a)}function rain(){let box=document.querySelector('#confetti');box.innerHTML='';for(let i=0;i<65;i++){let e=document.createElement('span');e.className='piece';e.style.setProperty('--left',Math.random()*100+'%');e.style.setProperty('--dur',(2+Math.random()*2.1)+'s');e.style.setProperty('--color',['#ec9cab','#ffdf80','#90d8ca','#84bde5','#c4b4eb'][i%5]);e.style.setProperty('--rot',Math.random()*180+'deg');e.style.animationDelay=Math.random()*.7+'s';box.append(e)}setTimeout(()=>box.innerHTML='',4900)}function celebrate(){lastPraise=randomExcept(PRAISES.length,lastPraise);document.querySelector('#praise').textContent=PRAISES[lastPraise];newQuote();document.querySelector('#overlay').classList.add('show');rain()}document.querySelector('#close').onclick=()=>document.querySelector('#overlay').classList.remove('show');document.querySelector('#again').onclick=()=>{tasks.forEach(t=>{t.classList.remove('done');t.setAttribute('aria-pressed','false');t.querySelector('.check').textContent=''});previousFull=false;update();document.querySelector('#overlay').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#overlay').classList.remove('show')});</script></body></html>
